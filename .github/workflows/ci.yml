name: ci

# TypeScript: typecheck, lint and every package's tests, with a Postgres for the database tests.
# Rust: the contracts (format, lints, unit tests) and the oracle's enclave build (lints, tests).
# The sandbox crates (tredio-sandbox-tests, tredio-test-publisher) need a nearcore sandbox; they run
# locally (`cd contracts && cargo test -p tredio-sandbox-tests`), not here.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch or pull request replaces its run; every commit on main keeps its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tredio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tredio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The backend's, Autopilot's and the indexer's database tests. The backend migrates it itself
      # (backend/test/helpers.ts) and, under CI, fails rather than skip when this is unset.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tredio_test
    steps:
      - uses: actions/checkout@v5
      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test

  contracts:
    name: Rust contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
      # The toolchain, components and targets in contracts/rust-toolchain.toml.
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts -> target
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --locked --workspace --exclude tredio-sandbox-tests --exclude tredio-test-publisher --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --workspace --exclude tredio-sandbox-tests --exclude tredio-test-publisher

  oracle-tee:
    name: Rust oracle enclave
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/oracle/tee
    steps:
      - uses: actions/checkout@v5
      # The pinned rustc in apps/oracle/tee/rust-toolchain.toml (the attested wasm hash depends on it).
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/oracle/tee -> target
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
