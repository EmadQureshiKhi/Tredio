[workspace]
resolver = "2"
members = [
    "common",
    "registry",
    "usdc",
    "curation",
    "outcomes",
    "book",
    "perps",
    "coin",
    "coins",
    "account",
    "accounts",
    "tests",
    "tests/publisher",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Emad Qureshi"]
repository = "https://github.com/EmadQureshiKhi/Tredio"

[workspace.dependencies]
near-sdk = { version = "5.30.1", default-features = false, features = ["wee_alloc"] }
near-contract-standards = "5.30.1"
borsh = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tredio-common = { path = "common" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Tests need no debug info; it is most of the target directory.
[profile.dev]
debug = 0

[profile.test]
debug = 0
