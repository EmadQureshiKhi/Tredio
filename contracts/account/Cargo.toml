[package]
name = "tredio-account"
description = "A Tredio user account: passkey owner, guarded gas-key sessions, and Hyperliquid orders signed through Chain Signatures behind an on-chain guard."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true, features = ["global-contracts"] }
tredio-common = { workspace = true }
hex = { workspace = true }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing", "global-contracts"] }
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"

# Reproducible build (`scripts/build.sh --reproducible`): SourceScan's pinned image builds the
# committed tree, and the wasm records the commit (NEP-330), so NearBlocks can verify it.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.98.1"
image_digest = "sha256:90cf2abe31d75946d82f1c6eee70802332b4d499ac39c01a5c41f228000ecb8a"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]
