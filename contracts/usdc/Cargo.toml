[package]
name = "tredio-usdc"
description = "Testnet USDC: a 6-decimal NEP-141 with a rate-limited faucet. Never deployed to mainnet."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }
tredio-common = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

# Reproducible build (`scripts/build.sh --reproducible`): SourceScan's pinned image builds the
# committed tree, and the wasm records the commit (NEP-330), so NearBlocks can verify it.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.98.1"
image_digest = "sha256:90cf2abe31d75946d82f1c6eee70802332b4d499ac39c01a5c41f228000ecb8a"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]
