[package]
name = "tredio-oracle-tee"
version = "0.1.0"
edition = "2021"
description = "Tredio's attention oracle as an OutLayer WASI program: recomputes the index from the collector's readings inside an Intel TDX enclave and signs the report with the project's enclave-held key."
license = "MIT"
authors = ["Emad Qureshi"]
publish = false

[[bin]]
name = "tredio-oracle-tee"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
outlayer = { version = "0.2.1", features = ["signing-keys"] }
wasi-http-client = "0.2"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
