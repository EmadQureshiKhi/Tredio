<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tredio scenes</title>
<!--
  Tredio's rendered pictures: link cards, the X banner and the website's example market scenes.
  Each scene is a URL hash (#og-site, #example-near...); export.sh screenshots them at their
  own size with headless Chrome. Every number here is illustrative, not live market data.
-->
<style>
@font-face { font-family: "Hanken"; src: url("../../../frontend/app/fonts/hanken-grotesk-light.woff2") format("woff2"); font-weight: 300; }
@font-face { font-family: "Hanken"; src: url("../../../frontend/app/fonts/hanken-grotesk-medium.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "News"; src: url("../../../frontend/app/fonts/newsreader-display-light.woff2") format("woff2"); font-weight: 300; }
:root {
  --bg: #09090b; --surface: #111113; --surface-2: #18181b; --surface-3: #222226;
  --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.14);
  --text: #fafafa; --text-2: rgba(250,250,250,.62); --text-3: rgba(250,250,250,.42);
  --primary: #a49bf0; --primary-strong: #c0b9f6; --primary-soft: rgba(164,155,240,.14);
  --accent: #e0ff98; --up: #34d399; --up-soft: rgba(52,211,153,.13); --down: #f87171; --down-soft: rgba(248,113,113,.13);
  --warn: #fbbf24;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Hanken", system-ui, sans-serif; font-weight: 300; -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
.abs { position: absolute; }
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.m { font-weight: 500; }
.serif { font-family: "News", Georgia, serif; font-weight: 300; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.t2 { color: var(--text-2); } .t3 { color: var(--text-3); } .up { color: var(--up); } .down { color: var(--down); } .pri { color: var(--primary); }
.card { background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 40%), var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 30px 70px -30px rgba(0,0,0,.9); }
.chip { display: inline-flex; align-items: center; gap: .45em; height: 2em; padding: 0 .8em; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); font-weight: 500; font-size: .8em; letter-spacing: .02em; white-space: nowrap; }
.chip.pri { background: var(--primary-soft); border-color: rgba(164,155,240,.3); color: var(--primary-strong); }
.chip.up { background: var(--up-soft); border-color: rgba(52,211,153,.28); color: var(--up); }
.chip.down { background: var(--down-soft); border-color: rgba(248,113,113,.28); color: var(--down); }
.chip.lime { background: rgba(224,255,152,.12); border-color: rgba(224,255,152,.3); color: var(--accent); }
.dot { width: .55em; height: .55em; border-radius: 50%; background: currentColor; display: inline-block; }
.eyebrow { font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); font-size: .72em; }
.avatar { display: grid; place-items: center; border-radius: 50%; font-weight: 500; color: #0b0a14; flex: none; }
.btn { display: flex; align-items: center; justify-content: space-between; border-radius: 14px; padding: 0 1em; font-weight: 500; }
.btn.up { background: var(--up-soft); border: 1px solid rgba(52,211,153,.3); color: var(--up); }
.btn.down { background: var(--down-soft); border: 1px solid rgba(248,113,113,.3); color: var(--down); }
.btn.pri { background: var(--primary); color: #0b0a14; justify-content: center; }
.btn.ghost { background: var(--surface-2); border: 1px solid var(--line); color: var(--text); justify-content: center; }
.hr { height: 1px; background: var(--line); }
.bar { height: .5em; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), var(--accent)); }
.glow { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(0); }
.grid-bg { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.3px); background-size: 28px 28px; mask-image: radial-gradient(ellipse at 50% 40%, #000 30%, transparent 80%); }
.num { font-variant-numeric: tabular-nums; }
.ok { width: 1.15em; height: 1.15em; border-radius: 50%; display: inline-grid; place-items: center; background: var(--up-soft); color: var(--up); flex: none; }
.ok svg { width: .7em; height: .7em; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* ---------- helpers ---------- */
const $ = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const stage = document.getElementById("stage");
const W = () => window.innerWidth, H = () => window.innerHeight;

// A seeded random walk from `a` to `b` over `n` points, so every render is the same.
function series(n, a, b, vol, seed) {
  let s = seed >>> 0;
  const rnd = () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296);
  const out = []; let v = a;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    v += (rnd() - 0.5) * vol;
    const target = a + (b - a) * t;
    v += (target - v) * 0.18;
    out.push(i === n - 1 ? b : v);
  }
  return out;
}

// A smooth path through points (Catmull-Rom as cubic Beziers).
function smooth(pts) {
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}

let gid = 0;
// An index chart: line, soft area, optional opening line and end dot.
function chart({ values, w, h, color = "var(--primary)", stroke = 3, min, max, area = true, dot = true, open = null, pad = 10, gridLines = 0 }) {
  const lo = min ?? Math.min(...values), hi = max ?? Math.max(...values);
  const pts = values.map((v, i) => [pad + (i / (values.length - 1)) * (w - pad * 2), pad + (1 - (v - lo) / (hi - lo)) * (h - pad * 2)]);
  const line = smooth(pts);
  const id = `g${gid++}`;
  const [lx, ly] = pts[pts.length - 1];
  const oy = open == null ? null : pad + (1 - (open - lo) / (hi - lo)) * (h - pad * 2);
  let grid = "";
  for (let i = 1; i <= gridLines; i++) { const y = (h / (gridLines + 1)) * i; grid += `<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`; }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".32"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    ${oy == null ? "" : `<line x1="0" x2="${w}" y1="${oy}" y2="${oy}" stroke="rgba(255,255,255,.28)" stroke-width="1.5" stroke-dasharray="5 6"/>`}
    ${area ? `<path d="${line} L${lx} ${h} L${pts[0][0]} ${h} Z" fill="url(#${id})"/>` : ""}
    <path d="${line}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round"/>
    ${dot ? `<circle cx="${lx}" cy="${ly}" r="${stroke * 3}" fill="${color}" opacity=".22"/><circle cx="${lx}" cy="${ly}" r="${stroke * 1.6}" fill="var(--bg)" stroke="${color}" stroke-width="${stroke}"/>` : ""}
  </svg>`;
}

const lockup = (h, color = "var(--text)", glyphColor = "var(--primary)") => `<svg height="${h}" viewBox="0 0 361.93 72" style="display:block;flex:none"><path fill="${glyphColor}" d="M0 1.24C23.37 7.15 43.98 -4.55 57.94 2.13V15.53H37.55L34.26 70.83H14.66C14.66 70.83 12.35 27.38 30.99 15.53H0C0 15.5 0 5.81 0 1.24Z"/><path fill="${color}" d="M68.86 70.83V2.13H98.06Q109.07 2.13 114.06 3.98Q119.05 5.83 122.05 10.57Q125.05 15.3 125.05 21.39Q125.05 29.12 120.5 34.16Q115.96 39.2 106.91 40.51Q111.41 43.13 114.34 46.27Q117.27 49.41 122.24 57.43L130.62 70.83H114.04L104.01 55.88Q98.66 47.87 96.7 45.78Q94.73 43.7 92.53 42.92Q90.32 42.15 85.54 42.15H82.73V70.83H68.86ZM82.73 31.18H92.99Q102.98 31.18 105.46 30.34Q107.94 29.5 109.35 27.44Q110.75 25.37 110.75 22.28Q110.75 18.81 108.9 16.68Q107.05 14.55 103.68 13.99Q101.99 13.75 93.56 13.75H82.73V31.18ZM138.12 70.83V2.13H189.06V13.75H151.99V28.98H186.48V40.56H151.99V59.25H190.37V70.83H138.12ZM202.09 2.13H227.44Q236.01 2.13 240.51 3.44Q246.56 5.22 250.87 9.77Q255.18 14.31 257.43 20.9Q259.68 27.48 259.68 37.14Q259.68 45.62 257.57 51.76Q254.99 59.25 250.21 63.89Q246.6 67.41 240.47 69.38Q235.87 70.83 228.19 70.83H202.09V2.13ZM215.96 13.75V59.25H226.31Q232.13 59.25 234.7 58.6Q238.08 57.75 240.3 55.74Q242.53 53.72 243.93 49.11Q245.34 44.49 245.34 36.53Q245.34 28.56 243.93 24.3Q242.53 20.03 240 17.64Q237.47 15.25 233.58 14.41Q230.67 13.75 222.19 13.75H215.96ZM271.02 70.83V2.13H284.89V70.83H271.02ZM295.29 36.9Q295.29 26.4 298.43 19.28Q300.78 14.03 304.83 9.86Q308.88 5.69 313.71 3.68Q320.13 0.96 328.52 0.96Q343.7 0.96 352.81 10.38Q361.93 19.8 361.93 36.57Q361.93 53.21 352.89 62.6Q343.84 72 328.7 72Q313.38 72 304.34 62.65Q295.29 53.3 295.29 36.9ZM309.59 36.43Q309.59 48.1 314.97 54.12Q320.36 60.14 328.66 60.14Q336.95 60.14 342.27 54.17Q347.59 48.19 347.59 36.25Q347.59 24.44 342.41 18.62Q337.23 12.82 328.66 12.82Q320.08 12.82 314.83 18.7Q309.59 24.58 309.59 36.43Z"/></svg>`;
const check = `<span class="ok"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.4 5 8.8l4.6-5.6"/></svg></span>`;

// A trend's round avatar: initials on a soft gradient.
const AV = {
  near: ["N", "linear-gradient(140deg,#d7d2ff,#a49bf0)"],
  ai: ["AI", "linear-gradient(140deg,#e0ff98,#9ad86b)"],
  heat: ["H", "linear-gradient(140deg,#ffd29a,#f59e6b)"],
  orbit: ["O", "linear-gradient(140deg,#9ee7ff,#6ab7f0)"],
  vinyl: ["V", "linear-gradient(140deg,#ffb3d9,#e57fb6)"],
  rain: ["R", "linear-gradient(140deg,#b9f5d8,#58c79a)"],
};
const avatar = (k, s) => `<div class="avatar" style="width:${s}px;height:${s}px;background:${AV[k][1]};font-size:${s * 0.38}px">${AV[k][0]}</div>`;

const delta = (v, size = 1) => `<span class="chip ${v >= 0 ? "up" : "down"}" style="font-size:${15 * size}px">${v >= 0 ? "▲" : "▼"} ${Math.abs(v).toFixed(1)}</span>`;

function trendHead(k, name, kind, s = 1) {
  return `<div class="row" style="gap:${14 * s}px">${avatar(k, 48 * s)}<div class="col" style="gap:${4 * s}px"><div class="m" style="font-size:${24 * s}px;letter-spacing:-.01em">${name}</div><div class="t3" style="font-size:${15 * s}px">${kind}</div></div></div>`;
}

function backdrop({ glowX = "70%", glowY = "20%", glowSize = 1100, color = "164,155,240", strength = 0.22, dots = true } = {}) {
  stage.appendChild($(`<div class="abs" style="inset:0;background:radial-gradient(${glowSize}px ${glowSize * 0.75}px at ${glowX} ${glowY}, rgba(${color},${strength}), rgba(${color},${strength * 0.3}) 40%, transparent 72%), var(--bg)"></div>`));
  if (dots) stage.appendChild($(`<div class="grid-bg"></div>`));
}

// Scales a composition to fill a region (fractions of the canvas) and centres it there.
function fit(html, [x0, y0, x1, y1], { maxScale = 3 } = {}) {
  const el = $(`<div class="abs" style="left:0;top:0;transform-origin:0 0">${html}</div>`);
  stage.appendChild(el);
  const w = el.offsetWidth, h = el.offsetHeight;
  const rw = (x1 - x0) * W(), rh = (y1 - y0) * H();
  const k = Math.min(rw / w, rh / h, maxScale);
  el.style.left = `${x0 * W() + (rw - w * k) / 2}px`;
  el.style.top = `${y0 * H() + (rh - h * k) / 2}px`;
  el.style.transform = `scale(${k})`;
  return el;
}

// Darkens the lower part of a full-screen picture, where the website sets its text.
const fadeBottom = (from = 0.42, to = 0.74) =>
  stage.appendChild($(`<div class="abs" style="inset:0;background:linear-gradient(180deg, transparent ${from * 100}%, var(--bg) ${to * 100}%)"></div>`));

const place = (html, css) => { const el = $(`<div class="abs" style="${css}">${html}</div>`); stage.appendChild(el); return el; };

/* ---------- cards (sizes scale with s) ---------- */

function upDownCard({ k = "near", name = "NEAR", kind = "Crypto · 24h round", index = 71.4, d = 8.2, values, open, up = "0.62", down = "0.38", closes = "06:12:40", w = 560, s = 1, chartH = 170 }) {
  return `<div class="card" style="width:${w * s}px;padding:${26 * s}px;font-size:${16 * s}px">
    <div class="row" style="justify-content:space-between">${trendHead(k, name, kind, s)}<span class="chip pri" style="font-size:${14 * s}px"><span class="dot"></span>Live</span></div>
    <div class="row" style="margin-top:${24 * s}px;align-items:flex-end;justify-content:space-between">
      <div class="col" style="gap:${6 * s}px"><span class="eyebrow">Attention index</span><span class="m num" style="font-size:${54 * s}px;letter-spacing:-.03em;line-height:1">${index.toFixed(1)}</span></div>
      <div class="col" style="align-items:flex-end;gap:${8 * s}px">${delta(d, s)}<span class="t3 num" style="font-size:${14 * s}px">Opened at ${open.toFixed(1)}</span></div>
    </div>
    <div style="margin:${18 * s}px -${6 * s}px 0">${chart({ values, w: (w - 40) * s, h: chartH * s, open, stroke: 3 * s, pad: 10 * s })}</div>
    <div class="row t3" style="justify-content:space-between;margin-top:${12 * s}px;font-size:${14 * s}px"><span>Round closes in</span><span class="m num" style="color:var(--text)">${closes}</span></div>
    <div class="row" style="gap:${12 * s}px;margin-top:${18 * s}px">
      <div class="btn up" style="flex:1;height:${58 * s}px;font-size:${18 * s}px"><span>UP</span><span class="num">${up} USDC</span></div>
      <div class="btn down" style="flex:1;height:${58 * s}px;font-size:${18 * s}px"><span>DOWN</span><span class="num">${down} USDC</span></div>
    </div>
  </div>`;
}

function perpCard({ k = "ai", name = "AI agents", kind = "Narrative · Attention perp", side = "Long", lev = "3x", size = "150.00", entry = "64.2", mark = "78.4", pnl = "+66.4%", liq = "43.1", funding = "+0.012%", w = 460, s = 1 }) {
  const row = (a, b, cls = "") => `<div class="row" style="justify-content:space-between;font-size:${16 * s}px"><span class="t3">${a}</span><span class="m num ${cls}">${b}</span></div>`;
  return `<div class="card" style="width:${w * s}px;padding:${26 * s}px;font-size:${16 * s}px">
    ${trendHead(k, name, kind, s)}
    <div class="row" style="gap:${8 * s}px;margin-top:${22 * s}px;padding:${5 * s}px;border-radius:${14 * s}px;background:var(--surface-2);border:1px solid var(--line)">
      <div class="btn up" style="flex:1;height:${44 * s}px;font-size:${16 * s}px;justify-content:center;border-radius:${10 * s}px">${side}</div>
      <div class="btn" style="flex:1;height:${44 * s}px;font-size:${16 * s}px;justify-content:center;color:var(--text-3)">Short</div>
    </div>
    <div class="col" style="gap:${14 * s}px;margin-top:${22 * s}px">
      ${row("Size", size + " USDC")}${row("Leverage", lev)}${row("Entry index", entry)}${row("Mark index", mark)}${row("Liquidation", liq)}${row("Funding (1h)", funding)}
    </div>
    <div class="hr" style="margin:${20 * s}px 0"></div>
    <div class="row" style="justify-content:space-between"><span class="t2" style="font-size:${16 * s}px">Unrealised PnL</span><span class="m num up" style="font-size:${26 * s}px">${pnl}</span></div>
  </div>`;
}

// A bonding curve with the price point, the floor and the graduation line.
function curve(w, h, s, progress = 0.72, floor = 0.38) {
  const pts = [];
  for (let i = 0; i <= 60; i++) { const t = i / 60; pts.push([t * w, h - (Math.pow(t, 2.2) * 0.88 + 0.04) * h]); }
  const at = pts[Math.round(progress * 60)];
  const filled = pts.slice(0, Math.round(progress * 60) + 1);
  const d = smooth(pts), df = smooth(filled);
  const fy = h - floor * h * 0.6;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible">
    <defs><linearGradient id="cv${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e0ff98" stop-opacity=".28"/><stop offset="1" stop-color="#e0ff98" stop-opacity="0"/></linearGradient></defs>
    <line x1="${w * 0.995}" x2="${w * 0.995}" y1="0" y2="${h}" stroke="rgba(255,255,255,.25)" stroke-dasharray="4 6"/>
    <path d="${df} L${at[0]} ${h} L0 ${h} Z" fill="url(#cv${gid++})"/>
    <path d="${d}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="${2 * s}"/>
    <path d="${df}" fill="none" stroke="#e0ff98" stroke-width="${3 * s}" stroke-linecap="round"/>
    <line x1="0" x2="${w}" y1="${fy}" y2="${fy}" stroke="var(--primary)" stroke-width="${2 * s}" stroke-dasharray="${6 * s} ${6 * s}"/>
    <circle cx="${at[0]}" cy="${at[1]}" r="${9 * s}" fill="#e0ff98" opacity=".25"/><circle cx="${at[0]}" cy="${at[1]}" r="${5 * s}" fill="#e0ff98"/>
  </svg>`;
}

function coinCard({ k = "heat", name = "Heatwave", ticker = "HEAT", price = "0.0184", progress = 0.72, holders = "1,284", w = 520, s = 1, curveH = 190 }) {
  return `<div class="card" style="width:${w * s}px;padding:${26 * s}px;font-size:${16 * s}px">
    <div class="row" style="justify-content:space-between">${trendHead(k, name, "Trend coin · $" + ticker, s)}<span class="chip lime" style="font-size:${14 * s}px">Bonding curve</span></div>
    <div class="row" style="margin-top:${22 * s}px;justify-content:space-between;align-items:flex-end">
      <div class="col" style="gap:${6 * s}px"><span class="eyebrow">Price</span><span class="m num" style="font-size:${40 * s}px;letter-spacing:-.02em;line-height:1">${price} <span class="t3" style="font-size:${18 * s}px">USDC</span></span></div>
      <div class="col" style="gap:${6 * s}px;align-items:flex-end"><span class="eyebrow">Holders</span><span class="m num" style="font-size:${22 * s}px">${holders}</span></div>
    </div>
    <div style="margin-top:${22 * s}px">${curve((w - 52) * s, curveH * s, s, progress)}</div>
    <div class="row t3" style="justify-content:space-between;margin-top:${10 * s}px;font-size:${13 * s}px"><span><span class="pri">- - -</span> Floor rises with peak attention</span><span>Graduation</span></div>
    <div style="margin-top:${18 * s}px" class="col"><div class="row" style="justify-content:space-between;font-size:${15 * s}px;margin-bottom:${8 * s}px"><span class="t2">To graduation</span><span class="m num">${Math.round(progress * 100)}%</span></div><div class="bar" style="height:${10 * s}px"><i style="width:${progress * 100}%"></i></div>
    <div class="t3" style="font-size:${13 * s}px;margin-top:${10 * s}px">Then it moves into a Rhea Finance pool</div></div>
  </div>`;
}

function oracleCard({ w = 420, s = 1 }) {
  return `<div class="card" style="width:${w * s}px;padding:${24 * s}px;font-size:${15 * s}px">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">Oracle report</span><span class="chip pri" style="font-size:${13 * s}px">OutLayer TEE</span></div>
    <div class="col" style="gap:${12 * s}px;margin-top:${18 * s}px">
      <div class="row" style="justify-content:space-between"><span class="t3">Trend</span><span class="m">Heatwave</span></div>
      <div class="row" style="justify-content:space-between"><span class="t3">Index</span><span class="m num">51.7</span></div>
      <div class="row" style="justify-content:space-between"><span class="t3">Sources</span><span class="m">6 of 6</span></div>
      <div class="row" style="justify-content:space-between"><span class="t3">Recorded on</span><span class="m">NEAR testnet</span></div>
    </div>
  </div>`;
}

function orderBook({ w = 420, s = 1 }) {
  const asks = [["0.66", "1,240"], ["0.65", "860"], ["0.64", "2,015"], ["0.63", "540"]];
  const bids = [["0.61", "980"], ["0.60", "1,760"], ["0.59", "620"], ["0.58", "2,340"]];
  const r = (p, q, side, fill) => `<div class="row num" style="position:relative;justify-content:space-between;height:${34 * s}px;padding:0 ${12 * s}px;font-size:${15 * s}px">
    <i style="position:absolute;right:0;top:${3 * s}px;bottom:${3 * s}px;width:${fill}%;border-radius:${6 * s}px;background:${side === "a" ? "var(--down-soft)" : "var(--up-soft)"}"></i>
    <span class="${side === "a" ? "down" : "up"} m" style="position:relative">${p}</span><span class="t2" style="position:relative">${q}</span></div>`;
  return `<div class="card" style="width:${w * s}px;padding:${22 * s}px ${14 * s}px;font-size:${15 * s}px">
    <div class="row" style="justify-content:space-between;padding:0 ${12 * s}px"><span class="eyebrow">Order book · UP</span><span class="t3" style="font-size:${13 * s}px">USDC</span></div>
    <div class="col" style="margin-top:${12 * s}px">${asks.map((a, i) => r(a[0], a[1], "a", [48, 30, 70, 22][i])).join("")}</div>
    <div class="row" style="justify-content:space-between;padding:${10 * s}px ${12 * s}px;margin:${4 * s}px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)"><span class="m num" style="font-size:${20 * s}px">0.62</span><span class="t3" style="font-size:${13 * s}px">Spread 0.02</span></div>
    <div class="col">${bids.map((b, i) => r(b[0], b[1], "b", [36, 64, 24, 82][i])).join("")}</div>
  </div>`;
}

function listRow(k, name, idx, d, s = 1, w = 360) {
  return `<div class="card row" style="width:${w * s}px;padding:${16 * s}px ${18 * s}px;gap:${14 * s}px;border-radius:${18 * s}px">${avatar(k, 40 * s)}<div class="col" style="gap:${3 * s}px"><span class="m" style="font-size:${18 * s}px">${name}</span><span class="t3" style="font-size:${13 * s}px">Attention index</span></div><div class="col" style="margin-left:auto;align-items:flex-end;gap:${5 * s}px"><span class="m num" style="font-size:${22 * s}px">${idx}</span><span class="num ${d >= 0 ? "up" : "down"}" style="font-size:${13 * s}px">${d >= 0 ? "▲" : "▼"} ${Math.abs(d).toFixed(1)}</span></div></div>`;
}
