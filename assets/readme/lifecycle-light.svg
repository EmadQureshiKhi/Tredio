nt-weight="400" fill="rgba(11, 11, 13, 0.64)" text-anchor="middle">evidence TEE-signed</text><circle cx="502" cy="240" r="15" fill="#f7f7f5" stroke="#5b4fd6" stroke-width="2"/><text x="502" y="245" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#5b4fd6" text-anchor="middle">3</text><rect x="414" y="274" width="176" height="96" rx="12" fill="#ffffff" stroke="rgba(91,79,214,0.5)"/><text x="502" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0d" text-anchor="middle">Listed</text><text x="502" y="324" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="rgba(11, 11, 13, 0.64)" text-anchor="middle">the oracle reports it</text><text x="502" y="342" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="rgba(11, 11, 13, 0.64)" text-anchor="middle">at 5 points or more</text><circle cx="698" cy="240" r="15" fill="#f7f7f5" stroke="#5b4fd6" stroke-width="2"/><text x="698" y="245" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#5b4fd6" text-anchor="middle">4</text><rect x="610" y="274" width="176" height="96" rx="12" fill="#ffffff" stroke="rgba(91,79,214,0.5)"/><text x="698" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0d" text-anchor="middle">Traded</text><text x="698" y="324" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="rgba(11, 11, 13, 0.64)" text-anchor="middle">24 h and 7 d series,</text><text x="698" y="342" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="rgba(11, 11, 13, 0.64)" text-anchor="middle">perps, its coin</text><circle cx="894" cy="240" r="15" fill="#f7f7f5" stroke="#0f8a5f" stroke-width="2"/><text x="894" y="245" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#0f8a5f" text-anchor="middle">5</text><rect x="806" y="274" width="176" height="96" rx="12" fill="#ffffff" stroke="rgba(15,138,95,0.5)"/><text x="894" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0d" text-anchor="middle">Settled</text><text x="894" y="324" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="rgba(11, 11, 13, 0.64)" text-anchor="middle">the registry&#x27;s value</text><text x="894" y="342" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="rgba(11, 11, 13, 0.64)" text-anchor="middle">at expiry pays out</text><circle cx="1090" cy="240" r="15" fill="#f7f7f5" stroke="#0f8a5f" stroke-width="2"/><text x="1090" y="245" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#0f8a5f" text-anchor="middle">6</text><rect x="1002" y="274" width="176" height="96" rx="12" fill="#ffffff" stroke="rgba(15,138,95,0.5)"/><text x="1090" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0d" text-anchor="middle">Retired</text><text x="1090" y="324" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="rgba(11, 11, 13, 0.64)" text-anchor="middle">stale or rotated out;</text><text x="1090" y="342" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11