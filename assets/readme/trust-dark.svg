<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Tredio&#x27;s trust model: who signs, what checks the signature, and what it can move"><title>Tredio&#x27;s trust model: who signs, what checks the signature, and what it can move</title><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="rgba(255,255,255,0.07)"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(250, 250, 250, 0.62)"/></marker></defs><rect x="0.5" y="0.5" width="1199" height="639" rx="18" fill="#09090b" stroke="rgba(255, 255, 255, 0.14)"/><rect x="0.5" y="0.5" width="1199" height="639" rx="18" fill="url(#dots)"/><text x="40" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#fafafa" text-anchor="start">Who can move what</text><text x="1160" y="54" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="rgba(250, 250, 250, 0.4)" text-anchor="end">every check runs on chain or reads the chain</text><text x="84" y="104" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="rgba(250, 250, 250, 0.4)" text-anchor="start" letter-spacing="1.6">WHO SIGNS</text><text x="430" y="104" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="rgba(250, 250, 250, 0.4)" text-anchor="start" letter-spacing="1.6">WHAT CHECKS IT</text><text x="876" y="104" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="rgba(250, 250, 250, 0.4)" text-anchor="start" letter-spacing="1.6">WHAT IT CAN MOVE</text><rect x="30" y="122" width="1140" height="86" rx="14" fill="#111113" stroke="rgba(255, 255, 255, 0.14)"/><circle cx="58" cy="165" r="13" fill="rgba(164,155,240,0.14)" stroke="rgba(164,155,240,0.7)"/><text x="58" y="170" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#a49bf0" text-anchor="middle">1</text><text x="84" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#fafafa" text-anchor="start">The enclave&#x27;s key</text><text x="84" y="183" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="rgba(250, 250, 250, 0.62)" text-anchor="start">OutLayer, bound to the build hash</text><path d="M378 165 L416 165" fill="none" stroke="rgba(250, 250, 250, 0.62)" stroke-width="1.6" marker-end="url(#arrow)"/><text x="430" y="160" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#fafafa" text-anchor="start">registry: env::ed25519_verify, run id,</text><text x="430" y="181" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="rgba(250, 250, 250, 0.62)" text-anchor="start">time window, 50% move clamp</text><path d="M826 165 L864 165" fill="none" stroke="rgba(250, 250, 250, 0.62)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="876" y="147" width="278" height="36" rx="18" fill="rgba(164,155,240,0.1)" stroke="rgba(164,155,240,0.4)"/><text x="1015" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#a49bf0" text-anchor="middle">the index, settlements, marks</text><rect x="30" y="222" width="1140" height="86" rx="14" fill="#111113" stroke="rgba(255, 255, 255, 0.14)"/><circle cx="58" cy="265" r="13" fill="rgba(164,155,240,0.14)" stroke="rgba(164,155,240,0.7)"/><text x="58" y="270" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#a49bf0" text-anchor="middle">2</text><text x="84" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#fafafa" text-anchor="start">Your passkey</text><text x="84" y="283" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="rgba(250, 250, 250, 0.62)" text-anchor="start">P-256, Face ID or a fingerprint</text><path d="M378 265 L416 265" fill="none" stroke="rgba(250, 250, 250, 0.62)" stroke-width="1.6" marker-end="url(#arrow)"/><text x="430" y="260" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#fafafa" text-anchor="start">account: p256_verify over SHA-256 of</text><text x="430" y="281" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="rgba(250, 250, 250, 0.62)" text-anchor="start">the request, user verification on v3</text><path d="M826 265 L864 265" fill="none" stroke="rgba(250, 250, 250, 0.62)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="876" y="247" width="278" height="36" rx="18" fill="rgba(164,155,240,0.1)" stroke="rgba(164,155,240,0.4)"/><text x="1015" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#a49bf0" text-anchor="middle">sessions, withdrawals, upgrades</text><rect x="30" y="322" width="1140" height="86" rx="14" fill="#111113" stroke="rgba(255, 255, 255, 0.14)"/><circle cx="58" cy="365" r="13" fill="rgba(164,155,240,0.14)" stroke="rgba(164,155,240,0.7)"/><text x="58" y="370" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#a49bf0" text-anchor="middle">3</text><text x="84" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#fafafa" text-anchor="start">A session gas key</text><text x="84" y="383" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="rgba(250, 250, 250, 0.62)" text-anchor="start">NEP-611, prepays its own gas</text><path d="M378 365 L416 365" fill="none" stroke="rgba(250, 250, 250, 0.62)" stroke-width="1.6" marker-end="url(#arrow)"/><text x="430" y="360" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#fafafa" text-anchor="start">account: typed actions only, a daily</text><text x="430" y="381" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="rgba(250, 250, 250, 0.62)" text-anchor="start">USDC cap, anchored prices, 2% / 10x</text><path d="M826 365 L864 365" fill="none" stroke="rgba(250, 250, 250, 0.62)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="876" y="347" width="278" height="36" rx="18" fill="rgba(164,155,240,0.1)" stroke="rgba(164,155,240,0.4)"/><text x="1015" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#a49bf0" text-anchor="middle">trades, never withdrawals</text><rect x="30" y="422" width="1140" height="86" rx="14" fill="#111113" stroke="rgba(255, 255, 255, 0.14)"/><circle cx="58" cy="465" r="13" fill="rgba(164,155,240,0.14)" stroke="rgba(164,155,240,0.7)"/><text x="58" y="470" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#a49bf0" text-anchor="middle">4</text><text x="84" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#fafafa" text-anchor="start">The relayer</text><text x="84" y="483" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="rgba(250, 250, 250, 0.62)" text-anchor="start">pays for sign-ups and requests</text><path d="M378 465 L416 465" fill="none" stroke="rgba(250, 250, 250, 0.62)" stroke-width="1.6" marker-end="url(#arrow)"/><text x="430" y="460" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#fafafa" text-anchor="start">checks the passkey proof itself and</text><text x="430" y="481" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="rgba(250, 250, 250, 0.62)" text-anchor="start">an activation ticket from the API</text><path d="M826 465 L864 465" fill="none" stroke="rgba(250, 250, 250, 0.62)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="876" y="447" width="278" height="36" rx="18" fill="rgba(164,155,240,0.1)" stroke="rgba(164,155,240,0.4)"/><text x="1015" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#a49bf0" text-anchor="middle">nothing it was not asked to send</text><rect x="30" y="522" width="1140" height="86" rx="14" fill="#111113" stroke="rgba(255, 255, 255, 0.14)"/><circle cx="58" cy="565" r="13" fill="rgba(164,155,240,0.14)" stroke="rgba(164,155,240,0.7)"/><text x="58" y="570" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#a49bf0" text-anchor="middle">5</text><text x="84" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#fafafa" text-anchor="start">NEP-413 sign-in</text><text x="84" y="583" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="rgba(250, 250, 250, 0.62)" text-anchor="start">a full-access or session key</text><path d="M378 565 L416 565" fill="none" stroke="rgba(250, 250, 250, 0.62)" stroke-width="1.6" marker-end="url(#arrow)"/><text x="430" y="560" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#fafafa" text-anchor="start">API: reads the key on chain, recipient</text><text x="430" y="581" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="rgba(250, 250, 250, 0.62)" text-anchor="start">tredio.bid (admin: admin.tredio.bid)</text><path d="M826 565 L864 565" fill="none" stroke="rgba(250, 250, 250, 0.62)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="876" y="547" width="278" height="36" rx="18" fill="rgba(164,155,240,0.1)" stroke="rgba(164,155,240,0.4)"/><text x="1015" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#a49bf0" text-anchor="middle">an API session, never funds</text></svg>
